<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Screen Calculator</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#10141c;
  color:white;
  font-family:Arial,sans-serif;
}
.calculator{
  width:100%;
  min-height:100dvh;
  padding:20px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
h2{text-align:center;color:#53ff75}
#display{
  width:100%;
  height:100px;
  margin:15px 0 25px;
  background:#202735;
  color:white;
  border:0;
  border-radius:15px;
  text-align:right;
  font-size:36px;
  padding:15px;
}
.buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
button{
  height:75px;
  border:0;
  border-radius:15px;
  font-size:27px;
  background:#293344;
  color:white;
}
.operator{background:#176b43}
.clear{background:#b93445}
.equal{background:#53ff75;color:#10141c}
#popup{
  position:fixed;
  inset:0;
  background:#000d;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.popup-box{
  background:#202735;
  border:2px solid #53ff75;
  border-radius:20px;
  padding:28px;
  text-align:center;
  width:100%;
  max-width:350px;
}
.popup-box h2{color:#53ff75}
.popup-box p{font-size:18px;line-height:1.5}
.popup-box button{
  width:100%;
  height:55px;
  margin-top:12px;
  background:#53ff75;
  color:#10141c;
  font-size:18px;
}
@media(min-width:600px){
  .calculator{max-width:480px;margin:auto}
}
</style>
</head>
<body>

<div class="calculator">
  <h2>MY CALCULATOR</h2>
  <input id="display" value="0" readonly>

  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">AC</button>
    <button onclick="deleteLast()">DEL</button>
    <button class="operator" onclick="add('%')">%</button>
    <button class="operator" onclick="add('/')">÷</button>

    <button onclick="add('7')">7</button>
    <button onclick="add('8')">8</button>
    <button onclick="add('9')">9</button>
    <button class="operator" onclick="add('*')">×</button>

    <button onclick="add('4')">4</button>
    <button onclick="add('5')">5</button>
    <button onclick="add('6')">6</button>
    <button class="operator" onclick="add('-')">−</button>

    <button onclick="add('1')">1</button>
    <button onclick="add('2')">2</button>
    <button onclick="add('3')">3</button>
    <button class="operator" onclick="add('+')">+</button>

    <button onclick="add('0')">0</button>
    <button onclick="add('.')">.</button>
    <button onclick="clearDisplay()">C</button>
    <button class="equal" onclick="calculate()">=</button>
  </div>
</div>

<div id="popup">
  <div class="popup-box">
    <h2>😂 PRANK ALERT!</h2>
    <p>Calculator unlock: ₹99</p>
    <p>अरे दोस्त! मज़ाक था 😂<br>तुम्हें कोई पैसे नहीं देने हैं।</p>
    <button onclick="closePopup()">😂 पकड़े गए!</button>
  </div>
</div>

<script>
const display = document.getElementById('display');
let expression = '';
let finished = false;

function add(value) {
  if (finished) {
    expression = '';
    finished = false;
  }
  expression += value;
  display.value = expression || '0';
}

function clearDisplay() {
  expression = '';
  display.value = '0';
  finished = false;
}

function deleteLast() {
  expression = expression.slice(0, -1);
  display.value = expression || '0';
  finished = false;
}

function calculate() {
  if (!expression) return;
  try {
    if (!/^[0-9+\-*/%.() ]+$/.test(expression)) throw Error();
    const result = Function('"use strict";return (' + expression + ')')();
    if (!Number.isFinite(result)) throw Error();
    display.value = String(Number(result.toPrecision(12)));
    expression = display.value;
    finished = true;
  } catch {
    display.value = 'Error';
    expression = '';
    finished = true;
  }
}

function closePopup() {
  document.getElementById('popup').style.display = 'none';
}

window.addEventListener('load', () => {
  document.getElementById('popup').style.display = 'flex';
});
</script>
</body>
</html>
